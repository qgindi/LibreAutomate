name: publish LA

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: |
          $msbuild = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild Au.sln -t:restore -t:build -p:Configuration=Release -p:Platform="Any CPU" -verbosity:minimal
          & $msbuild Au.sln -t:build -p:Configuration=Release -p:Platform=ARM64 -verbosity:minimal
          & $msbuild Au.sln -t:build -p:Configuration=Release -p:Platform=x86 -verbosity:minimal

      - name: Install Master Packager Dev
        run: |
          winget install --id=MasterPackager.MasterPackagerDev -e --accept-source-agreements --accept-package-agreements --skip-dependencies
          # Master Packager Dev will create our MSI installer.

      - name: Create installer
        run: |
          Other\BuildEvents\bin\BuildEvents.exe createInstaller
          # BuildEvents.exe creates/copies a list of files to add to the MSI package, executes mpdev (Master Packager Dev) which creates `LibreAutomate.msi`, and adds some MSI options that are unsupported by mpdev directly.
  
      - name: upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          path: _\LibreAutomate.msi
          archive: false
    
      - name: submit signing request
        if: false # TODO
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '07d655b1-2c96-4986-a3f0-5f43d7e86ec1'
          project-slug: 'LibreAutomate'
          signing-policy-slug: 'test-signing'
          # signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          output-artifact-directory: '_\signed'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          skip-decompress: true

      # Now the signed `LibreAutomate.msi` can be found in the SignPath account. Don't use `upload-artifact` again, it will fail.

      - name: Get release version vX.X
        if: github.ref_type == 'tag'
        id: version
        run: |
          $vXX = '${{ github.ref_name }}' -replace '\.\d+$', ''
          "vXX=$vXX" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true # TODO
          #files: _\signed\LibreAutomate.msi
          files: _\LibreAutomate.msi
          body: |
            [What's new in ${{ steps.version.outputs.vXX }}](https://github.com/qgindi/LibreAutomate/blob/master/Other/DocFX/_doc/changes/${{ steps.version.outputs.vXX }}.md)

            <details>
            <summary>System requirements</summary>

            - Windows 10 (x64) and 11 (x64, Arm64)
            - Windows 7 and 8.1 - see [installing .NET](https://learn.microsoft.com/en-us/dotnet/core/install/windows)

            LibreAutomate uses the .NET 10 Desktop Runtime. Will prompt to install it if missing.
            </details>

            <details>
            <summary>How to install</summary>

            Download and run `LibreAutomate.msi`.

            Need more options? Run [msiexec](https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/msiexec) instead. Examples:
            - Run the installer in reduced UI mode: `msiexec /i "C:\Downloads\LibreAutomate.msi" /qr`
            - Change the app folder: `msiexec /i "C:\Downloads\LibreAutomate.msi" INSTALLDIR="app folder path"`

            </details>
