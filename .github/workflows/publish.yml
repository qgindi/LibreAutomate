name: publish LA

on:
  #push:
  #  branches: ["master"]
  workflow_dispatch:
    inputs:
      publish_github:
        description: Create or update GitHub release
        type: boolean
        default: false
      publish_nuget:
        description: Push package to NuGet
        type: boolean
        default: false

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build solution
      run: |
        $msbuild = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
        & $msbuild Au.sln -t:restore -t:build -p:Configuration=Release -p:Platform="Any CPU"
        